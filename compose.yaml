# Optional LOCAL PostgreSQL only; production uses managed PostgreSQL in Amvera.
services:
  db:
    image: postgres:16-bookworm
    environment:
      POSTGRES_USER: bgl
      POSTGRES_DB: bgl
      POSTGRES_PASSWORD: ${LOCAL_DB_PASSWORD:?Set LOCAL_DB_PASSWORD for local PostgreSQL}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - bgl-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bgl -d bgl"]
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  bgl-postgres:
