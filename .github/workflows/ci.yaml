name: Checks
on:
  push:
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-bookworm
        env:
          POSTGRES_USER: bgl
          POSTGRES_PASSWORD: ci-only-database-password
          POSTGRES_DB: bgl_test
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U bgl -d bgl_test" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://bgl:ci-only-database-password@localhost:5432/bgl_test
      TEST_DATABASE_URL: postgresql://bgl:ci-only-database-password@localhost:5432/bgl_test
      SESSION_SECRET: ci-only-session-secret-with-at-least-32-characters
      DEV_SEED_PASSWORD: ci-only-strong-dev-account-password
      APP_BASE_URL: http://localhost:3001
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run db:generate
      - run: npm run check
      - run: npm run test:integration
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: docker build -t bgl-content-hub:ci .
